    <line x1="720" y1="505" x2="780" y2="505" marker-start="url(#cf-zero-many)"/>
    <line x1="870" y1="505" x2="910" y2="505" marker-end="url(#cf-zero-many)"/>

    <!-- 18. LISTENING_HISTORY -> RECORDS -> TRACK -->
