<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="ms-mono-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Black Square Base with Crisp White Border -->
  <rect width="100" height="100" rx="24" fill="#000000" stroke="#ffffff" stroke-width="2.5" />
  
  <!-- Stylized Monochromatic "M" Sound Wave Equalizer -->
  <g filter="url(#ms-mono-glow)">
    <!-- Left Column -->
    <rect x="22" y="32" width="8.5" height="40" rx="4.25" fill="#ffffff" />
    
    <!-- Diagonal Left -->
    <path d="M 28 36 L 50 58 L 44 64 L 22 42 Z" fill="#ffffff" />
    
    <!-- Diagonal Right -->
    <path d="M 72 36 L 50 58 L 56 64 L 78 42 Z" fill="#ffffff" />
    
    <!-- Right Column -->
    <rect x="69.5" y="32" width="8.5" height="40" rx="4.25" fill="#ffffff" />
    
    <!-- Center Pulse -->
    <rect x="46" y="26" width="8" height="28" rx="4" fill="#ffffff" />
  </g>

  <!-- High-Contrast Magic Star (Top Right) -->
  <path d="M 78 18 Q 78 26 86 26 Q 78 26 78 34 Q 78 26 70 26 Q 78 26 78 18 Z" fill="#ffffff" />
  <circle cx="78" cy="26" r="2" fill="#000000" />
</svg>
